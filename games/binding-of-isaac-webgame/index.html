<!DOCTYPE html>
<html lang="zh-CN">
<head><script>/*khayal-iso*/(function(){try{
var P='khayal:binding-of-isaac-webgame:';
if(window.__khayalIso)return;window.__khayalIso=1;
var real=window.localStorage;
var proxy=new Proxy({},{
 get:function(_,k){
  if(k==='getItem')return function(x){var v=real.getItem(P+String(x));return v;};
  if(k==='setItem')return function(x,v){real.setItem(P+String(x),String(v));};
  if(k==='removeItem')return function(x){real.removeItem(P+String(x));};
  if(k==='clear')return function(){var d=[];for(var i=0;i<real.length;i++){var n=real.key(i);if(n.indexOf(P)===0)d.push(n);}d.forEach(function(n){real.removeItem(n);});};
  if(k==='key')return function(i){var c=-1;for(var j=0;j<real.length;j++){var n=real.key(j);if(n.indexOf(P)===0){c++;if(c===i)return n.slice(P.length);}}return null;};
  if(k==='length'){var c=0;for(var j=0;j<real.length;j++){if(real.key(j).indexOf(P)===0)c++;}return c;}
  if(typeof k==='symbol')return undefined;
  var v=real.getItem(P+k);return v===null?undefined:v;},
 set:function(_,k,v){real.setItem(P+String(k),String(v));return true;},
 deleteProperty:function(_,k){real.removeItem(P+String(k));return true;},
 has:function(_,k){return real.getItem(P+String(k))!==null;},
 ownKeys:function(){var o=[];for(var j=0;j<real.length;j++){var n=real.key(j);if(n.indexOf(P)===0)o.push(n.slice(P.length));}return o;},
 getOwnPropertyDescriptor:function(_,k){var v=real.getItem(P+String(k));return v===null?undefined:{value:v,writable:true,enumerable:true,configurable:true};}
});
Object.defineProperty(window,'localStorage',{get:function(){return proxy;},configurable:true});
if(window.indexedDB){
 var idb=window.indexedDB,oo=idb.open.bind(idb),od=idb.deleteDatabase.bind(idb);
 idb.open=function(n,v){return v===undefined?oo(P+n):oo(P+n,v);};
 idb.deleteDatabase=function(n){return od(P+n);};
 if(idb.databases){var odb=idb.databases.bind(idb);idb.databases=function(){return odb().then(function(l){return l.filter(function(d){return d.name.indexOf(P)===0;}).map(function(d){return {name:d.name.slice(P.length),version:d.version};});});};}
}
if(window.caches){
 var C=window.caches,co=C.open.bind(C),ch=C.has.bind(C),cd=C.delete.bind(C);
 C.open=function(n){return co(P+n);};C.has=function(n){return ch(P+n);};C.delete=function(n){return cd(P+n);};
}
}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>THE BINDING — 地下室的束缚</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="game" width="900" height="540"></canvas>

  <!-- ============ 开始界面 ============ -->
  <div class="screen" id="screen-title">
    <div class="title-block">
      <h1 class="game-title">THE BINDING</h1>
      <p class="game-sub">地 下 室 的 束 缚</p>
    </div>
    <div class="title-foot">
      <button class="btn" id="btn-start">开 始 探 索</button>
      <p class="hint">
        <b>WASD</b> 移动 &nbsp;·&nbsp; <b>方向键</b> 射击 &nbsp;·&nbsp; <b>P</b> 暂停 &nbsp;·&nbsp; 手机端使用虚拟摇杆

      <p class="title-links">
        <a href="https://github.com/liyupi/binding-of-isaac-webgame" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>开源仓库
        </a>
        <a href="https://space.bilibili.com/12890453" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4.7 1.5 6.9 3.5M11.3 1.5 9.1 3.5"/><rect x="1.3" y="3.9" width="13.4" height="10.5" rx="2.6"/><path d="M5.3 7.7v2.1M10.7 7.7v2.1"/></svg>作者 · 程序员鱼皮

      </p>
    </div>
  </div>

  <!-- ============ 死亡界面 ============ -->
  <div class="screen hidden" id="screen-dead">
    <h2 class="dead-title">YOU DIED</h2>
    <p class="dead-sub" id="dead-sub">你在地下室深处倒下了</p>
    <div class="stat-grid" id="dead-stats"></div>
    <div class="item-recap" id="dead-items"></div>
    <button class="btn" id="btn-retry">再 来 一 次</button>
  </div>

  <!-- ============ 通关界面 ============ -->
  <div class="screen hidden" id="screen-win">
    <h2 class="win-title">ESCAPED</h2>
    <p class="dead-sub">你击穿了十二层地牢, 逃出了地下室</p>
    <div class="stat-grid" id="win-stats"></div>
    <div class="item-recap" id="win-items"></div>
    <button class="btn" id="btn-again">再 来 一 局</button>
  </div>

  <!-- ============ 暂停 ============ -->
  <div class="screen hidden pause" id="screen-pause">
    <h2 class="pause-title">PAUSED</h2>
    <p class="hint">按 <b>P</b> 继续</p>
  </div>

</div>

<!-- ============ 移动端操控（固定在视口上，不随画布缩放） ============ -->
<div id="touch-ui" class="hidden">
  <div id="rotate-hint"><span class="ph"></span>横屏握持可获得更大的画面</div>
  <div id="joystick"><div id="joy-knob"></div></div>
  <div id="shoot-pad">
    <button class="sbtn" id="sb-up"    data-dir="up">▲</button>
    <button class="sbtn" id="sb-left"  data-dir="left">◀</button>
    <button class="sbtn" id="sb-right" data-dir="right">▶</button>
    <button class="sbtn" id="sb-down"  data-dir="down">▼</button>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/art.js"></script>
<script src="js/dungeon.js"></script>
<script src="js/items.js"></script>
<script src="js/entities.js"></script>

</html>
