 has:function(_,k){return real.getItem(P+String(k))!==null;},
 ownKeys:function(){var o=[];for(var j=0;j<real.length;j++){var n=real.key(j);if(n.indexOf(P)===0)o.push(n.slice(P.length));}return o;},

<body>
    <center>
        <p>
            Realtime Web Cam streamer made in JavaScript,click on the button and enjoy your video.
        </p>
    <div>
    <video id="vid" controls></video>
    </div>
    <button id="but" autoplay>Open Web Cam</button>

    <script>
document.addEventListener("DOMContentLoaded", () => { 

var but = document.getElementById("but"); 

var video = document.getElementById("vid"); 

var mediaDevices = navigator.mediaDevices; 

vid.muted = false; 

but.addEventListener("click", () => { 



  // Accessing the user camera and video. 

  mediaDevices 

    .getUserMedia({ 

      video: true, 

      audio: true, 

    }) 

    .then((stream) => { 



      // Changing the source of video to current stream. 

      video.srcObject = stream; 

      video.addEventListener("loadedmetadata", () => { 

        video.play(); 

      }); 

    }) 

    .catch(alert); 

}); 

}); 

    </script>
