<!doctype html><script>/*khayal-iso*/(function(){try{
var P='khayal:flowforgeweb:';
if(window.__khayalIso)return;window.__khayalIso=1;
var real=window.localStorage;
var proxy=new Proxy({},{
 get:function(_,k){
  if(k==='getItem')return function(x){var v=real.getItem(P+String(x));return v;};
  if(k==='setItem')return function(x,v){real.setItem(P+String(x),String(v));};
  if(k==='removeItem')return function(x){real.removeItem(P+String(x));};
  if(k==='clear')return function(){var d=[];for(var i=0;i<real.length;i++){var n=real.key(i);if(n.indexOf(P)===0)d.push(n);}d.forEach(function(n){real.removeItem(n);});};
  if(k==='key')return function(i){var c=-1;for(var j=0;j<real.length;j++){var n=real.key(j);if(n.indexOf(P)===0){c++;if(c===i)return n.slice(P.length);}}return null;};
  if(k==='length'){var c=0;for(var j=0;j<real.length;j++){if(real.key(j).indexOf(P)===0)c++;}return c;}
  if(typeof k==='symbol')return undefined;
  var v=real.getItem(P+k);return v===null?undefined:v;},
 set:function(_,k,v){real.setItem(P+String(k),String(v));return true;},
 deleteProperty:function(_,k){real.removeItem(P+String(k));return true;},
 has:function(_,k){return real.getItem(P+String(k))!==null;},
 ownKeys:function(){var o=[];for(var j=0;j<real.length;j++){var n=real.key(j);if(n.indexOf(P)===0)o.push(n.slice(P.length));}return o;},
 getOwnPropertyDescriptor:function(_,k){var v=real.getItem(P+String(k));return v===null?undefined:{value:v,writable:true,enumerable:true,configurable:true};}
});
Object.defineProperty(window,'localStorage',{get:function(){return proxy;},configurable:true});
if(window.indexedDB){
 var idb=window.indexedDB,oo=idb.open.bind(idb),od=idb.deleteDatabase.bind(idb);
 idb.open=function(n,v){return v===undefined?oo(P+n):oo(P+n,v);};
 idb.deleteDatabase=function(n){return od(P+n);};
 if(idb.databases){var odb=idb.databases.bind(idb);idb.databases=function(){return odb().then(function(l){return l.filter(function(d){return d.name.indexOf(P)===0;}).map(function(d){return {name:d.name.slice(P.length),version:d.version};});});};}
}
if(window.caches){
 var C=window.caches,co=C.open.bind(C),ch=C.has.bind(C),cd=C.delete.bind(C);
 C.open=function(n){return co(P+n);};C.has=function(n){return ch(P+n);};C.delete=function(n){return cd(P+n);};
}
}catch(e){}})();</script>
<meta charset="utf-8">
<title>FlowForge toolbox i18n regression</title>
<style>
  body{font:13px/1.5 ui-monospace,Consolas,monospace;margin:12px;background:#111;color:#ddd}
  .pass{color:#4ade80}.fail{color:#f87171;font-weight:700}
  iframe{position:absolute;left:-9999px;top:0;width:1700px;height:900px;border:0}
  #summary{margin:10px 0;font-weight:700}
</style>
<h3>FlowForge – Toolbox traduzida (pt-BR / en / es)</h3>
<p>Abra por um servidor local: <code>python -m http.server</code> na raiz do projeto e visite <code>/tests/toolbox_i18n_test.html</code>.</p>
<div id="summary">Executando…</div>
<pre id="out"></pre>
<iframe id="app" src="../index.html"></iframe>
<script>
const out=document.getElementById('out'),summary=document.getElementById('summary');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const escHtml=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let passed=0,failed=0;
function check(name,cond,detail){
  if(cond){passed++;out.insertAdjacentHTML('beforeend','<span class="pass">PASS</span> '+escHtml(name)+'\n');}
  else{failed++;out.insertAdjacentHTML('beforeend','<span class="fail">FAIL</span> '+escHtml(name)+(detail!==undefined?'  → '+escHtml(JSON.stringify(detail)):'')+'\n');}
}
async function run(){
  const f=document.getElementById('app');
  await new Promise(r=>f.addEventListener('load',r,{once:true}));
  await sleep(600);
  let W,D;
  try{W=f.contentWindow;D=f.contentDocument;D.body;}catch(e){
    summary.textContent='Sem acesso ao app: abra por http://, não por file://';document.body.dataset.test='FAIL';return;
  }
  const $=s=>D.querySelector(s);
  const closeDialogs=()=>D.querySelectorAll('dialog[open]').forEach(x=>x.close());
  async function createProject(type){ /* "Novo" abre o assistente: é preciso clicar em "Criar projeto" */
    $('[data-new='+type+']').click();await sleep(250);
    if($('#siteWizardDlg')?.open)$('#wizCreate').click();
    await sleep(450);closeDialogs();
  }
  const lang=async l=>{W.FlowForgeI18n.setLanguage(l);await sleep(250)};
  const label=kind=>$(`#tools .tool[data-kind="${kind}"] .toolLabel`)?.textContent;
  const groups=()=>[...D.querySelectorAll('#tools .toolGroup')].map(x=>x.textContent);
  const kinds=()=>[...D.querySelectorAll('#tools .tool')].map(x=>x.dataset.kind);
  const search=async v=>{const el=$('#toolSearch');el.value=v;el.dispatchEvent(new W.Event('input',{bubbles:true}));await sleep(150)};

  closeDialogs();await createProject('app');

  /* ---------- cobertura: toda ferramenta/grupo tem tradução ---------- */
  const TG=W.eval('TOOL_GROUPS');
  const dict=W.FlowForgeToolI18n.dictionary();
  const allKinds=[...new Set(Object.values(TG).flatMap(t=>t.map(x=>x[0])))];
  const missingPt=allKinds.filter(k=>!dict.tools['pt-BR'][k]);
  const missingEs=allKinds.filter(k=>!dict.tools.es[k]);
  const unknown=Object.keys(dict.tools['pt-BR']).filter(k=>!allKinds.includes(k));
  check(`todas as ${allKinds.length} ferramentas têm nome em pt-BR`,missingPt.length===0,missingPt);
  check('todas as ferramentas têm nome em es',missingEs.length===0,missingEs);
  check('o dicionário não tem ferramentas inexistentes',unknown.length===0,unknown);
  const gk=Object.keys(TG);
  check('todos os grupos têm tradução (pt-BR, en, es)',['pt-BR','en','es'].every(l=>gk.every(g=>dict.groups[l][g])),gk.filter(g=>!dict.groups.es[g]||!dict.groups.en[g]||!dict.groups['pt-BR'][g]));

  /* ---------- pt-BR ---------- */
  await lang('pt-BR');
  check('pt-BR: TextBox vira "Caixa de texto"',label('input')==='Caixa de texto',label('input'));
  check('pt-BR: PictureBox vira "Caixa de imagem"',label('picturebox')==='Caixa de imagem',label('picturebox'));
  check('pt-BR: Button vira "Botão"',label('button')==='Botão',label('button'));
  check('pt-BR: ComboBox vira "Caixa de combinação"',label('combobox')==='Caixa de combinação',label('combobox'));
  check('pt-BR: Timer vira "Temporizador"',label('timer')==='Temporizador',label('timer'));
  check('pt-BR: grupos traduzidos',groups().includes('Básicos')&&groups().includes('Jogos')&&groups().includes('Não visuais')&&groups().includes('Componentes FlowForge'),groups());
  check('dica (title) mostra o nome traduzido',$('#tools .tool[data-kind="input"]').title==='Caixa de texto',$('#tools .tool[data-kind="input"]').title);

  /* ---------- en ---------- */
  await lang('en');
  check('en: mantém o nome técnico "TextBox"',label('input')==='TextBox',label('input'));
  check('en: grupos em inglês',groups().includes('Basics')&&groups().includes('Forms')&&groups().includes('Games')&&groups().includes('Non-visual'),groups());

  /* ---------- es ---------- */
  await lang('es');
  check('es: TextBox vira "Cuadro de texto"',label('input')==='Cuadro de texto',label('input'));
  check('es: grupos em espanhol',groups().includes('Formularios')&&groups().includes('Juegos')&&groups().includes('Multimedia / Web'),groups());

  /* ---------- identificadores e comportamento não mudam ---------- */
  await lang('pt-BR');
  const kindsBefore=kinds().join(',');
  await lang('es');await lang('pt-BR');
  check('data-kind (identificador) não muda com o idioma',kinds().join(',')===kindsBefore);
  W.eval("addItem('input')");await sleep(150);
  const item=W.eval("ffItems().at(-1)");
  check('inserir "Caixa de texto" cria o tipo input',item.kind==='input',item.kind);
  check('nome do componente continua sendo um identificador válido',/^[A-Za-z_$][\w$]*$/.test(item.name),item.name);
  check('nome do componente não é traduzido',!/caixa|texto/i.test(item.name),item.name);
  check('arrastar usa o tipo (não o nome traduzido)',W.eval("(()=>{const b=document.querySelector('#tools .tool[data-kind=\"input\"]');const dt=new DataTransfer();b.ondragstart({dataTransfer:dt});return window.ffPaletteDragKind+'|'+dt.getData('text/plain')})()")==='input|input');

  /* ---------- busca ---------- */
  await search('caixa de texto');
  check('busca pelo nome traduzido encontra a ferramenta',kinds().includes('input'),kinds());
  await search('textbox');
  check('busca pelo nome técnico original continua funcionando',kinds().includes('input'),kinds());
  await search('rotulo');
  check('busca ignora acentos ("rotulo" acha "Rótulo")',kinds().includes('label'),kinds());
  await search('formularios');
  check('busca pelo nome do grupo mostra o grupo',groups().length===1&&groups()[0]==='Formulários',groups());
  await search('zzzzz');
  check('busca sem resultado deixa a lista vazia',kinds().length===0&&groups().length===0);
  await search('');

  /* ---------- troca de idioma mantém o texto da busca ---------- */
  await search('text');
  const q=$('#toolSearch').value;
  await lang('en');
  check('trocar idioma mantém o texto digitado na busca',$('#toolSearch').value===q&&label('input')==='TextBox',[$('#toolSearch').value,label('input')]);
  await lang('pt-BR');
  check('...e re-renderiza no idioma novo',label('input')==='Caixa de texto',label('input'));
  await search('');

  /* ---------- nomes não são cortados no botão ---------- */
  for(const l of ['pt-BR','en','es']){
    await lang(l);
    const cut=[...D.querySelectorAll('#tools .tool .toolLabel')].filter(e=>e.scrollHeight>e.clientHeight+1).map(e=>e.textContent);
    check(`${l}: nenhum nome fica cortado no botão`,cut.length===0,cut);
  }
  await lang('pt-BR');

  summary.textContent=failed?`${failed} falha(s), ${passed} ok`:`Tudo certo: ${passed} verificações`;
  summary.className=failed?'fail':'pass';
  document.body.dataset.test=failed?'FAIL':'PASS';
}
run().catch(e=>{out.insertAdjacentHTML('beforeend','<span class="fail">ERRO</span> '+escHtml(e.message)+'\n');summary.textContent='Erro no teste';document.body.dataset.test='FAIL';});
</script>
