<!DOCTYPE html>
<html lang="en">
<head><script>/*khayal-iso*/(function(){try{
var P='khayal:phavuer:';
if(window.__khayalIso)return;window.__khayalIso=1;
var real=window.localStorage;
var proxy=new Proxy({},{
 get:function(_,k){
  if(k==='getItem')return function(x){var v=real.getItem(P+String(x));return v;};
  if(k==='setItem')return function(x,v){real.setItem(P+String(x),String(v));};
  if(k==='removeItem')return function(x){real.removeItem(P+String(x));};
  if(k==='clear')return function(){var d=[];for(var i=0;i<real.length;i++){var n=real.key(i);if(n.indexOf(P)===0)d.push(n);}d.forEach(function(n){real.removeItem(n);});};
  if(k==='key')return function(i){var c=-1;for(var j=0;j<real.length;j++){var n=real.key(j);if(n.indexOf(P)===0){c++;if(c===i)return n.slice(P.length);}}return null;};
  if(k==='length'){var c=0;for(var j=0;j<real.length;j++){if(real.key(j).indexOf(P)===0)c++;}return c;}
  if(typeof k==='symbol')return undefined;
  var v=real.getItem(P+k);return v===null?undefined:v;},
 set:function(_,k,v){real.setItem(P+String(k),String(v));return true;},
 deleteProperty:function(_,k){real.removeItem(P+String(k));return true;},
 has:function(_,k){return real.getItem(P+String(k))!==null;},
 ownKeys:function(){var o=[];for(var j=0;j<real.length;j++){var n=real.key(j);if(n.indexOf(P)===0)o.push(n.slice(P.length));}return o;},
 getOwnPropertyDescriptor:function(_,k){var v=real.getItem(P+String(k));return v===null?undefined:{value:v,writable:true,enumerable:true,configurable:true};}
});
Object.defineProperty(window,'localStorage',{get:function(){return proxy;},configurable:true});
if(window.indexedDB){
 var idb=window.indexedDB,oo=idb.open.bind(idb),od=idb.deleteDatabase.bind(idb);
 idb.open=function(n,v){return v===undefined?oo(P+n):oo(P+n,v);};
 idb.deleteDatabase=function(n){return od(P+n);};
 if(idb.databases){var odb=idb.databases.bind(idb);idb.databases=function(){return odb().then(function(l){return l.filter(function(d){return d.name.indexOf(P)===0;}).map(function(d){return {name:d.name.slice(P.length),version:d.version};});});};}
}
if(window.caches){
 var C=window.caches,co=C.open.bind(C),ch=C.has.bind(C),cd=C.delete.bind(C);
 C.open=function(n){return co(P+n);};C.has=function(n){return ch(P+n);};C.delete=function(n){return cd(P+n);};
}
}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phaser (Plane API) vs Phavuer</title>
  <script src="https://unpkg.com/phaser@4.1.0/dist/phaser.min.js"></script>
  <script src="https://unpkg.com/vue@3.5.24/dist/vue.global.prod.js"></script>
  <script src="./dist/phavuer.min.js"></script>
</head>
<body>
  <h1>Phaser (Plane) vs Phavuer</h1>
  <p>Below are examples of UIs implemented in Phaser and Phavuer, respectively. Please review and compare their source codes.</p>
  <div id="phaser"></div>
  <div id="phavuer"></div>
  <script>
    const fontStyle = style => Object.assign({ color: '#FFF', fontStyle: 'bold', fontSize: 15, fontFamily: 'san-serif' }, style)

    // ----- 1. Phaser (Plane API)
    const logicInPlane = scene => {
      let count = 1
      const parentContainer = scene.add.container(20, 20)
      const title = scene.add.text(0, 0, '1. Phaser (Plane)', fontStyle({ fontSize: 21 }))
      const counter = scene.add.text(0, 35, '', fontStyle())
      const del = scene.add.text(90, 35, '[DELETE]', fontStyle({ color: '#0AF' })).setInteractive()
      parentContainer.add([title, counter, del])
      const getNewBox = (x, y, addable) => {
        const container = scene.add.container(x, y)
        const rectangle = scene.add.rectangle(0, 0, 100, 100, addable ? 0x333333 : 0x888888).setOrigin(0)
        container.add([rectangle])
        if (addable) {
          const plus = scene.add.text(50, 50, '[＋]', fontStyle({ color: '#0AF', fontSize: 18 })).setOrigin(0.5)
          rectangle.setInteractive().on('pointerdown', () => {
            count++
            init()
          })
          container.add([plus])
        }
        return container
      }
      del.on('pointerdown', () => {
        count--
        init()
      })
      const init = () => {
        del.setVisible(count > 0)
        parentContainer.list.filter(v => v.type === 'Container').forEach(v => v.destroy())
        counter.setText(`Count: ${count}`)
        const rectCount = count < 7 ? count + 1 : count
        const boxes = [...Array(rectCount)].map((_, i) => getNewBox(i * 110, 60, i === count && count < 7))
        parentContainer.add(boxes)
      }
      init()
    }
    new Phaser.Game({
      type: Phaser.AUTO,
      width: 800,
      height: 200,
      scene: {
        create () {
          logicInPlane(this)
        }
      },
      parent: 'phaser'
    })

    // ----- 2. Phavuer (Vue 3)
    const { Game, Scene, Container, Rectangle, Text } = Phavuer
    const Box = {
      components: { Container, Rectangle, Text },
      template: `
        <Container :x="x" :y="y">
          <Rectangle :width="100" :height="100" :origin="0" :fillColor="addable ? 0x333333 : 0x888888" @pointerdown="onClickBox" />
          <Text :x="50" :y="50" :origin="0.5" :style="fontStyle({ color: '#5AF', fontSize: 18 })" v-if="addable" text="[＋]" />
        </Container>`,
      props: ['x', 'y', 'addable'],
      setup (props, context) {
        const onClickBox = () => {
          if (props.addable) context.emit('add')
        }
        return { fontStyle, onClickBox }
      }
    }
    const MainScene = {
      components: { Game, Scene, Container, Text, Box },
      template: `
        <Game :config="{ width: 800, height: 200 }">
          <Scene name="MainScene" :autoStart="true">
            <Container :x="20" :y="20">
              <Text :style="fontStyle({ fontSize: 21 })" text="2. Phavuer" />
              <Text :y="35" :style="fontStyle()" :text="\`Count: \${count}\`" />
              <Text :x="90" :y="35" :style="fontStyle({ color: '#5AF' })" @pointerdown="count--" v-if="count > 0" text="[DELETE]" />
              <Box :x="i * 110" :y="60" :addable="i === count" @add="count++" v-for="(_, i) in rectCount" :key="i" />
            </Container>
          </Scene>
        </Game>`,
      setup () {
        const count = Vue.ref(0)
        const rectCount = Vue.computed(() => count.value < 7 ? count.value + 1 : count.value)
        return { count, rectCount, fontStyle }
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      Vue.createApp(MainScene).mount('#phavuer')
    })
  </script>

  <style>
    body { margin: 10px; }
    canvas { display: block; margin-bottom: 10px; }
  </style>
</body>
</html>
