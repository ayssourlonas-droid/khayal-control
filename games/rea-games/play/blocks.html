<body>
<main>
  <header><h1>Blocks</h1><span>own art &middot; rules rebuilt from the recording</span></header>
  <div id="stage">
    <div id="court">
      <canvas id="c" width="300" height="600" role="img" aria-label="Blocks game"></canvas>
      <div id="msg"><h2 id="msgtitle">Blocks</h2><p id="msgsub">Press Space or tap to play</p></div>
    </div>
    <aside>
      <div class="box"><small>next</small><canvas id="nextc" width="100" height="100" role="img" aria-label="Next piece"></canvas></div>
      <div aria-live="polite" aria-atomic="true">
        <div class="box"><small>score</small><b id="score">0</b></div>
        <div class="box"><small>rows</small><b id="rows">0</b></div>
        <div class="box"><small>best</small><b id="best">0</b></div>
      </div>
      <button id="restart" type="button">New game</button>
    </aside>
  </div>
  <div id="pad">
    <button type="button" data-k="left" aria-label="left">&larr;</button>
    <button type="button" data-k="up" aria-label="rotate">&#8635;</button>
    <button type="button" data-k="down" aria-label="down">&darr;</button>
    <button type="button" data-k="right" aria-label="right">&rarr;</button>
  </div>
  <p class="keys"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &middot; <kbd>&uarr;</kbd> rotate &middot; <kbd>&darr;</kbd> drop a row &middot; <kbd>Esc</kbd> give up &middot; <kbd>Space</kbd> play. Fill whole rows to clear them; the pieces fall faster as your rows grow.</p>

// Written from games/blocks/GAME.md (what the original does, observed and read), not copied.

const W = 10, H = 20;
const KINDS = "ijlostz";

const SHAPES = {
  i: { size: 4, masks: [0x0f00, 0x2222, 0x00f0, 0x4444] },
  j: { size: 3, masks: [0x44c0, 0x8e00, 0x6440, 0x0e20] },
  l: { size: 3, masks: [0x4460, 0x0e80, 0xc440, 0x2e00] },
  o: { size: 2, masks: [0xcc00, 0xcc00, 0xcc00, 0xcc00] },
  s: { size: 3, masks: [0x06c0, 0x8c40, 0x6c00, 0x4620] },
  t: { size: 3, masks: [0x0e40, 0x4c40, 0x4e00, 0x4640] },

function cellsOf(kind, x, y, dir) {

  for (let i = 0; i < 16; i++) if (mask & (0x8000 >> i)) out.push([x + (i & 3), y + (i >> 2)]);

  constructor({ rng, clock0 = T0 }) {

    this.last = Math.floor(clock0);

  // ---- pieces

    // the one taken until it is the only one left

  key(name) {
    if (this.playing) {
      if (name === "left") this.actions.push("left");
      else if (name === "right") this.actions.push("right");
      else if (name === "up") this.actions.push("up");
      else if (name === "down") this.actions.push("down");
      else if (name === "esc") this.lose();
      // "play" is the start link; it works in any state (the page hides it while playing)
      else if (name === "play") this.play();
    } else if (name === "space" || name === "play") this.play();
  }

  step({ dt, keys = [] }) {
    for (const k of keys) this.key(k);
    this.t += dt;
    const now = Math.floor(this.t);
    const idt = Math.min(1, (now - this.last) / 1000);

    e.preventDefault();

      press(b.dataset.k);
